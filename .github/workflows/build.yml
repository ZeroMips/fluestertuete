# Builds both boards and runs the host tests on every push. A version tag (v1.2.3) also publishes the setup
# website with that firmware to GitHub Pages (fluestertuete.zeromips.org).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the firmware version comes from git describe

      - name: Tools for the host tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y -qq build-essential ffmpeg zlib1g-dev nodejs python3-yaml cloud-init >/dev/null

      - name: Build T-Deck
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Build Core2
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-core2 -D SDKCONFIG=build-core2/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.core2 \
                 -D IDF_TARGET=esp32 build

      - name: Host tests
        run: tests/run.sh

      - name: Website with firmware
        run: python3 tools/web_bundle.py

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: web

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
