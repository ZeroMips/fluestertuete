# /etc/cd-ripper/cd-ripper.conf  -  KEY=value, no shell syntax.
# On a station set up from the website this file is written by setup-station.py from station.conf;
# this copy (/usr/local/lib/ripstation/cd-ripper.conf) lists every setting with its default.

# Language of the station's web page: de or en
# LANG=de

# Contact for the MusicBrainz User-Agent (they ask for one): the project page by default.
# MB_CONTACT=https://fluestertuete.zeromips.org

# GnuDB (the free CDDB, many German audio dramas MusicBrainz lacks) is asked when MusicBrainz knows a disc
# not at all. It refuses anonymous requests: set an e-mail address here to enable it, empty = off.
GNUDB_CONTACT=
# GNUDB_APP=fluestertuete-ripstation

# Optional: Discogs personal access token (https://www.discogs.com/settings/developers).
# Used as a second signal ("Children's" + "Story") for audio dramas that are not on the series list.
DISCOGS_TOKEN=

# Where finished albums go. A class is ripped in exactly the formats that have a DEST line.
# Classes: MUSIC, KIDS (children's audio drama), SPOKEN (audiobook), UNSORTED.
# Albums are written as <DEST>/<Artist>/<Album>/NN - Title.<ext>. The NAS share is mounted at /mnt/nas.
DEST_KIDS_MP3=/mnt/nas/Hörspiele
DEST_SPOKEN_MP3=/mnt/nas/Hörbücher
DEST_MUSIC_MP3=/mnt/nas/Musik
DEST_UNSORTED_MP3=/mnt/nas/Unsortiert
# FLAC as well, e.g.:  DEST_MUSIC_FLAC=/mnt/nas/FLAC/Musik

# Before ripping, the NAS is searched for the album (Artist/Album, up to 3 folder levels below each root).
# Same album with the same number of tracks -> not ripped, the disc is ejected; the web page offers
# "Nächste CD trotzdem rippen". A different edition (other track count) is ripped and only noted.
# LIBRARY_CHECK=1
# LIBRARY_ROOTS=/mnt/nas

# Mount points that must be up before delivery (triggered via systemd automount).
MOUNT_POINTS=/mnt/nas

# --- Web page (cd-web) ---
# WEB_PORT=80
# WEB_PASSWORD=             # set to require a login (user name: cd); the Flüstertüte needs the same password

# --- Bluetooth speaker (cd-bt): the Flüstertüte sends albums here to play them on the speaker ---
# Pair the speaker on the station's web page ("Lautsprecher").
# BT_PORT=8081
# BT_DEVICE=                # speaker address; empty = the paired one
# BT_SHARE_DIR=/mnt/nas/Hörspiele   # the folder the Flüstertüte plays, as seen here
# BT_VOLUME=50              # start volume, percent

# --- Optional hardware panel (cd-ui, disabled by default). Defaults shown; pin numbers are BCM GPIO numbers. ---
# UI_DISPLAY=lcd            # lcd (1602, 4-bit) | oled (SSD1327 on I2C) | none
# LCD_PINS=22,23,24,25,5,6  # RS,E,D4,D5,D6,D7
# ENCODER_PINS=27,26        # CLK,DT of the rotary encoder (empty = single button only)
# BUTTON_GPIO=17            # encoder push button or the single button
# BUZZER_GPIO=12            # active buzzer signal pin (empty = silent)
