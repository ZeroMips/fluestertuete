# /etc/cd-ripper/abcde.conf  -  used by cd-rip (non-interactive). Metadata comes from a
# per-disc cache file that cd-rip writes from MusicBrainz; tags are rewritten by cd-rip afterwards.

CDROMREADERSYNTAX=cdparanoia
CDPARANOIAOPTS="--never-skip=40"

FLACENCODERSYNTAX=flac
FLAC=flac
FLACOPTS='-s -e -V -8'

MP3ENCODERSYNTAX=lame
LAME=lame
LAMEOPTS='-V 2'            # VBR, about 190 kbit/s; fine for phones, cars and audio dramas

OUTPUTTYPE=mp3             # overridden by cd-rip (-o)
OUTPUTDIR="$CDRIP_JOBDIR/out"
WAVOUTPUTDIR="$CDRIP_JOBDIR/wav"
OUTPUTFORMAT='${OUTPUT}/${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='${OUTPUT}/Various Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'
ONETRACKOUTPUTFORMAT='${OUTPUT}/${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}'
VAONETRACKOUTPUTFORMAT='${OUTPUT}/Various Artists/${ALBUMFILE}/${ALBUMFILE}'
PADTRACKS=y

# Local metadata cache written by cd-rip
CDDBUSELOCAL=y
CDDBLOCALRECURSIVE=y
CDDBLOCALDIR="$CDRIP_CDDB_DIR"
CDDBCOPYLOCAL=n

MAXPROCS=4
INTERACTIVE=n
EJECTCD=n
ID3TAGV=id3v2.3

# File names that are safe on NFS/SMB/FAT (car USB sticks): no : * ? " < > | and no "/"
mungefilename ()
{
	echo "$@" | sed -e 's/^\.*//' -e 's/[:"*?<>|]//g' -e 's/\// -/g' -e 's/  */ /g' -e 's/^ //' -e 's/ $//'
}
